# Production : API Express sur Render + PostgreSQL géré.
databases:
  - name: csi-cnam-db
    databaseName: csi_cnam
    plan: basic-256mb

services:
  - type: web
    name: csi-cnam-api
    runtime: node
    plan: starter
    rootDir: server
    buildCommand: npm ci && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: csi-cnam-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: RELEASE_SHA
        sync: false
      - key: JWT_EXPIRES_IN
        value: 2h
      - key: SESSION_COOKIE_MAX_AGE_SECONDS
        value: "7200"
      - key: MAX_LOGIN_ATTEMPTS
        value: "5"
      - key: TEMP_PASSWORD_EXPIRES_HOURS
        value: "24"
      - key: SHUTDOWN_TIMEOUT_SECONDS
        value: "15"
      - key: RATE_LIMIT_MAX
        value: "600"
